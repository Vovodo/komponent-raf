services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      # Coolify kendi panelinde 8000 portunu kullandığı için çakışmaması adına host portu 18080 varsayılandır.
      # Coolify domain bağladığınızda doğrudan konteyner içi 8000 portuna (HTTPS + WebSocket) yönlendirir.
      - "${APP_PORT:-18080}:8000"
    environment:
      TZ: Europe/Istanbul
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-komponent_raf}
      DEFAULT_PUBLIC_BASE_URL: ${DEFAULT_PUBLIC_BASE_URL:-http://localhost:18080}
      SERVICE_URL_APP: ${SERVICE_URL_APP:-}
      COOLIFY_URL: ${COOLIFY_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
